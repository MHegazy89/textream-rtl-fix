name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          XCODE_PATH=$(ls /Applications/Xcode*.app/Contents/Developer | head -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Build DMG
        working-directory: Textream
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Textream-DMG
          path: Textream/build/release/Textream.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Textream-DMG
          path: .
      - uses: softprops/action-gh-release@v2
        with:
          files: Textream.dmg
          name: Textream \${{ github.ref_name }}
          body: |
            ### Installation
            1. Download and open the DMG
            2. Drag **Textream** to Applications
            3. If blocked: `xattr -cr /Applications/Textream.app`
