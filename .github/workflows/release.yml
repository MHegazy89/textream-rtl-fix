name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build with SPM
        run: |
          swift build -c release --product Textream
          mkdir -p build/release
          cp .build/release/Textream build/release/
          cd build/release && tar czf Textream-macos-arm64.tar.gz Textream

      - uses: actions/upload-artifact@v4
        with:
          name: Textream-macos-arm64
          path: build/release/Textream-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Textream-macos-arm64
          path: .
      - uses: softprops/action-gh-release@v2
        with:
          files: Textream-macos-arm64.tar.gz
          name: Textream ${{ github.ref_name }}
          body: |
            ### Installation
            1. Download the tarball
            2. Extract: `tar xzf Textream-macos-arm64.tar.gz`
            3. Move to PATH: `sudo mv Textream /usr/local/bin/`
