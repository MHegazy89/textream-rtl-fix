name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build with SPM
        run: |
          swift build -c release --product Textream
          mkdir -p build/release
          cp .build/release/Textream build/release/

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_staging
          cp -r build/release/Textream /tmp/dmg_staging/
          hdiutil create -volname "Textream" -srcfolder /tmp/dmg_staging -ov -format UDZO build/release/Textream.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Textream-DMG
          path: build/release/Textream.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Textream-DMG
          path: .
      - uses: softprops/action-gh-release@v2
        with:
          files: Textream.dmg
          name: Textream ${{ github.ref_name }}
          body: |
            ### Installation
            1. Download and open the DMG
            2. Drag **Textream** to Applications
            3. If blocked: `xattr -cr /Applications/Textream.app`
